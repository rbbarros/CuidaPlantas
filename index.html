<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubra plantas ideais para sua casa e aprenda como cuidar delas!">
    <title>CuidaPlantas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            text-align: center;
            color: #2e7d32;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #1b5e20;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 8px #aaa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .img-container {
            width: 200px;
            height: 150px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1b5e20;
        }
    </style>
</head>

<body>

    <h1>Cuida Plantas 🌱</h1>
    <p>Descubra plantas ideais para sua casa e aprenda como cuidar delas!</p>

    <div class="grid" id="plants"></div>

    <script>
        const plantas = [
            { id: 0, nome: "Jiboia", cientifico: "Epipremnum aureum", rega: "A cada 3 a 5 dias", busca: "Epipremnum aureum", cuidado: "Luz indireta, ótima para ambientes internos e fácil para iniciantes." },
            { id: 1, nome: "Espada-de-São-Jorge", cientifico: "Dracaena trifasciata", rega: "A cada 10 a 15 dias", busca: "Sansevieria trifasciata", cuidado: "Muito resistente. Pode ficar em locais com pouca luz." },
            { id: 2, nome: "Samambaia", cientifico: "Nephrolepis exaltata", rega: "2 a 3 vezes por semana", busca: "Nephrolepis exaltata", cuidado: "Gosta de umidade e luz indireta." },
            { id: 3, nome: "Zamioculca", cientifico: "Zamioculcas zamiifolia", rega: "A cada 7 a 10 dias", busca: "Zamioculcas zamiifolia", cuidado: "Ideal para apartamentos e pessoas que esquecem de regar." },
            { id: 4, nome: "Lírio-da-paz", cientifico: "Spathiphyllum", rega: "2 a 3 vezes por semana", busca: "Spathiphyllum plant", cuidado: "Prefere sombra e solo sempre levemente úmido." },
            { id: 5, nome: "Costela-de-Adão", cientifico: "Monstera deliciosa", rega: "1 a 2 vezes por semana", busca: "Monstera deliciosa", cuidado: "Gosta de ambientes iluminados sem sol direto." },
            { id: 6, nome: "Pilea", cientifico: "Pilea peperomioides", rega: "A cada 5 a 7 dias", busca: "Pilea peperomioides", cuidado: "Prefere locais claros e protegidos do sol forte." },
            { id: 7, nome: "Peperômia", cientifico: "Peperomia obtusifolia", rega: "A cada 5 a 7 dias", busca: "Peperomia obtusifolia", cuidado: "Boa para interiores e vasos pequenos." },
            { id: 8, nome: "Suculentas", cientifico: "Diversas espécies", rega: "A cada 10 a 15 dias", busca: "succulent plant", cuidado: "Precisam de bastante luz e pouca água." },
            { id: 9, nome: "Cactos", cientifico: "Cactaceae", rega: "A cada 15 a 30 dias", busca: "cactus plant", cuidado: "Resistentes e ideais para locais ensolarados." }
        ];

        function mostrarCuidados(texto) {
            alert(texto);
        }

        function renderizarEstrutura() {
            const grid = document.querySelector("#plants");
            grid.innerHTML = plantas.map(planta => `
                <div class="card">
                    <div class="img-container" id="img-box-${planta.id}"></div>
                    <h3>${planta.nome} 🌿</h3>
                    <p><b>Nome científico:</b><br>${planta.cientifico}</p>
                    <p>💧 ${planta.rega}</p>
                    <button onclick="mostrarCuidados('${planta.cuidado}')">Ver cuidados</button>
                </div>
            `).join('');
        }

    
        async function carregarImagens() {
            for (const planta of plantas) {
                const API = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="
                    + encodeURIComponent(planta.busca) + "&gsrnamespace=6&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=400&format=json&origin=*";

                try {
                    const resposta = await fetch(API);
                    const dados = await resposta.json();
                    let urlImagem = "";

                    if (dados.query) {
                        const page = Object.values(dados.query.pages)[0];
                        if (page.thumbnail) {
                            urlImagem = page.thumbnail.source;
                        }
                    }

                    const box = document.getElementById(`img-box-${planta.id}`);
                    if (box && urlImagem) {
                        box.innerHTML = `<img src="${urlImagem}" alt="${planta.nome}" width="200" height="150" loading="lazy">`;
                    }
                } catch (e) {
                    console.error("Erro na imagem:", e);
                }
            }
        }

        renderizarEstrutura();
        carregarImagens();
    </script>
</body>

</html>

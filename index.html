<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CuidaPlanta - informações para cuidar das suas plantas.">
    <title>CuidaPlanta 🌱</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font: 16px Arial; background: #e8f5e9; color: #1b4332; }
        header { padding: 25px; text-align: center; background: #2e7d32; color: #fff; }
        main { max-width: 1000px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .plant { overflow: hidden; background: #fff; border-radius: 15px; box-shadow: 0 4px 15px #bbb; }
        .plant img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .info { padding: 15px; }
        .info h2 { margin-top: 0; font-size: 1.2rem; text-transform: capitalize; }
        .info p { margin: 5px 0; font-size: 0.9rem; }
        @media (max-width: 520px) {
            header { text-align: left; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header>
        <h1>CuidaPlanta 🌱</h1>
        <p>Escolha uma planta e descubra mais sobre ela!</p>
    </header>

    <main>
        <div class="grid" id="plants">Carregando plantas...</div>
    </main>

    <script>
        const nomes = {
        "jacob's coat": "Periquito",
        "hot water plant": "Acandilado",
        "desert rose": "Rosa-do-deserto",
        "onion": "Cebola",
        "amazonian elephant's ear": "Alocásia-amazônica",
        "aloe": "Babosa",

        "flowering-maple": "Lanterna-chinesa",
        "maidenhair fern": "Avenca",
        "delta maidenhair fern": "Avenca-delta",
        "urn plant": "Vaso-de-prata",
        "stalked aeonium": "Aeônio",
        "lipstick plant": "Columneia-batom",
        "philippine evergreen": "Aglaonema-café",
        "chinese evegreen": "Aglaonema",
        "chinese evergreen": "Aglaonema",
        "elephant's ear": "Orelha-de-elefante",
        "giant elephant's ear": "Orelha-de-elefante-gigante",
        "joseph's coat": "Periquito",
        "anthurium": "Antúrio",
        "zebra plant": "Afelandra",
        "trailing snapdragon": "Asarina",
        "sprenger's asparagus fern": "Aspargo-samambaia",
        "asparagus fern": "Aspargo-pluma",
        "cast-iron plant": "Aspidistra",
        "bird's nest fern": "Asplênio",
        "japanese painted fern": "Samambaia-pintada-japonesa"
    };

        // Tradução simples de rega
        function traduzirRega(watering) {
            if (!watering) return "Não informado";
            switch (watering.toLowerCase()) {
                case "frequent": return "Frequente";
                case "average": return "Moderada";
                case "minimum": return "Pouca";
                case "none": return "Nenhuma";
                default: return watering;
            }
        }

        // Tradução simples de luz solar
        function traduzirLuz(sunlight) {
            if (!sunlight || sunlight.length === 0) return "Não informado";
            const traducoes = {
                "full sun": "Sol pleno",
                "part shade": "Meia-sombra",
                "full shade": "Sombra total",
                "filtered light": "Luz filtrada",
                "part sun/part shade": "Sol parcial",
                "sheltered": "Abrigada"
            };
            return sunlight.map(s => traducoes[s.toLowerCase()] || s).join(", ");
        }

        // Tradução simples de ciclo de vida
        function traduzirCiclo(cycle) {
            if (!cycle) return "Não informado";
            switch (cycle.toLowerCase()) {
                case "perennial": return "Perene";
                case "annual": return "Anual";
                case "biennial": return "Bienal";
                case "biannual": return "Bianual";
                default: return cycle;
            }
        }

        async function carregarPlantas() {
            try {
                const resposta = await fetch("/.netlify/functions/plantas");
                const resultado = await resposta.json();
                const grid = document.querySelector("#plants");

                // DEBUG: aperte F12 no navegador e veja o Console
                console.log("Resposta da API:", resultado);
                console.log("Primeira planta:", resultado.data?.[0]);

                grid.innerHTML = "";

                resultado.data.forEach(planta => {
                    const nome = planta.common_name?.toLowerCase().trim();
                    const nomePortugues = nomes[nome] || planta.common_name || "Planta";

                    grid.innerHTML += `
                        <article class="plant">
                            <img src="${planta.default_image?.regular_url || "https://placehold.co/600x400/e8f5e9/1b4332?text=CuidaPlanta"}"
                                 alt="${nomePortugues}"
                                 loading="lazy">
                            <div class="info">
                                <h2>${nomePortugues}</h2>
                                <p>💧 Rega: ${traduzirRega(planta.watering)}</p>
                                <p>☀️ Luz: ${traduzirLuz(planta.sunlight)}</p>
                                <p>🔄 Ciclo: ${traduzirCiclo(planta.cycle)}</p>
                            </div>
                        </article>`;
                });

            } catch (erro) {
                document.querySelector("#plants").innerHTML =
                    "<p>Não foi possível carregar as plantas.</p>";
            }
        }

        carregarPlantas();
    </script>
</body>
</html>

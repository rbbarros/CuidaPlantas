<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CuidaPlanta - informações para cuidar das suas plantas.">
    <title>CuidaPlanta 🌱</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font: 16px Arial; background: #e8f5e9; color: #1b4332; }
        header { padding: 25px; text-align: center; background: #2e7d32; color: #fff; }
        main { max-width: 1000px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .plant { overflow: hidden; background: #fff; border-radius: 15px; box-shadow: 0 4px 15px #bbb; }
        .plant img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .info { padding: 15px; }
        .info h2 { margin-top: 0; }
        @media (max-width: 520px) { header { text-align: left; } .grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <header>
        <h1>CuidaPlanta 🌱</h1>
        <p>Escolha uma planta e descubra como cuidar dela!</p>
    </header>

    <main>
        <div class="grid" id="plants">Carregando plantas...</div>
    </main>

    <script>

       const nomes = {
        "flowering-maple": "Ácer-florido",
        "snake plant": "Espada-de-São-Jorge",
        "peace lily": "Lírio-da-Paz",
        "pothos": "Jiboia",
        "zz plant": "Zamioculca",
        "monstera": "Costela-de-Adão",
        "fern": "Samambaia",
        "anthurium": "Antúrio",
        "rubber plant": "Ficus-elástica",
        "areca palm": "Palmeira-areca"
    };


        async function carregarPlantas() {
            try {
                const resposta = await fetch("/.netlify/functions/plantas");
                const resultado = await resposta.json();
                const grid = document.querySelector("#plants");

                grid.innerHTML = "";

                resultado.data.forEach(planta => {
                    grid.innerHTML += `
                        <article class="plant">
                            <img src="${planta.default_image?.regular_url}" 
                                 alt="${planta.common_name || "Planta"}" 
                                 loading="lazy">

                            <div class="info">
                                <h2>${nomes[planta.common_name?.toLowerCase()] || planta.common_name || "Planta sem nome"}</h2>
                                <p>💧 <strong>Rega:</strong> ${planta.watering || "Média"}</p>
                                <p>☀️ <strong>Luz:</strong> ${planta.sunlight?.join(", ") || "Meia-sombra"}</p>
                            </div>
                        </article>`;
                });

            } catch (erro) {
                document.querySelector("#plants").innerHTML =
                    "<p>Não foi possível carregar as plantas.</p>";
            }
        }

        carregarPlantas();
    </script>
</body>
</html>

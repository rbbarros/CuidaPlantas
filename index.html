<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CuidaPlanta - informações para cuidar das suas plantas.">
    <meta name="theme-color" content="#2e7d32">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <title>CuidaPlanta 🌱</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font: 16px Arial; background: #e8f5e9; color: #1b4332; }
        header { padding: 25px; text-align: center; background: #2e7d32; color: #fff; }
        main { max-width: 1000px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .plant { overflow: hidden; background: #fff; border-radius: 15px; box-shadow: 0 4px 15px #bbb; }
        .plant img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .info { padding: 15px; }
        .info h2 { margin-top: 0; font-size: 1.2rem; text-transform: capitalize; }
        .info p { margin: 5px 0; font-size: 0.9rem; }

        /* Seção da câmera */
        .camera-section {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px #bbb;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        .camera-section h2 { margin-top: 0; }
        .btn-camera {
            background: #2e7d32;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-camera:hover { background: #1b5e20; }
        #foto-tirada {
            display: none;
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 10px;
        }
        #input-camera { display: none; }

        @media (max-width: 520px) {
            header { text-align: left; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header>
        <h1>CuidaPlanta 🌱</h1>
        <p>Escolha uma planta e descubra mais sobre ela!</p>
    </header>

    <main>
        <!-- RECURSO DE HARDWARE: Câmera do dispositivo -->
        <section class="camera-section">
            <h2>📸 Fotografe sua planta</h2>
            <p>Use a câmera do seu celular para tirar uma foto da sua planta!</p>
            <input type="file" accept="image/*" capture="environment" id="input-camera">
            <button class="btn-camera" onclick="document.getElementById('input-camera').click()">
                📷 Abrir Câmera
            </button>
            <br>
            <img id="foto-tirada" alt="Foto da sua planta">
            <p id="msg-foto" style="display:none; color:#2e7d32; font-weight:bold;">
                ✅ Foto capturada com sucesso!
            </p>
        </section>

        <h2>🌿 Nossas Plantas</h2>
        <div class="grid" id="plants">Carregando plantas...</div>
    </main>

    <script>
        // ========================================
        // 1. REGISTRAR O SERVICE WORKER (para PWA)
        // ========================================
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }

        // ========================================
        // 2. CÂMERA - Recurso de hardware
        // ========================================
        document.getElementById("input-camera").addEventListener("change", function(evento) {
            var arquivo = evento.target.files[0];
            if (arquivo) {
                var foto = document.getElementById("foto-tirada");
                foto.src = URL.createObjectURL(arquivo);
                foto.style.display = "block";
                document.getElementById("msg-foto").style.display = "block";
            }
        });

        // ========================================
        // 3. NOMES DAS PLANTAS EM PORTUGUÊS
        // ========================================
        const nomes = {
            "jacob's coat": "Periquito",
            "hot water plant": "Acandilado",
            "desert rose": "Rosa-do-deserto",
            "onion": "Cebola",
            "amazonian elephant's ear": "Alocásia-amazônica",
            "aloe": "Babosa",
            "flowering-maple": "Lanterna-chinesa",
            "maidenhair fern": "Avenca",
            "delta maidenhair fern": "Avenca-delta",
            "urn plant": "Vaso-de-prata",
            "stalked aeonium": "Aeônio",
            "lipstick plant": "Columneia-batom",
            "philippine evergreen": "Aglaonema-café",
            "chinese evegreen": "Aglaonema",
            "chinese evergreen": "Aglaonema",
            "elephant's ear": "Orelha-de-elefante",
            "giant elephant's ear": "Orelha-de-elefante-gigante",
            "joseph's coat": "Periquito",
            "anthurium": "Antúrio",
            "zebra plant": "Afelandra",
            "trailing snapdragon": "Asarina",
            "sprenger's asparagus fern": "Aspargo-samambaia",
            "asparagus fern": "Aspargo-pluma",
            "cast-iron plant": "Aspidistra",
            "bird's nest fern": "Asplênio",
            "japanese painted fern": "Samambaia-pintada-japonesa"
        };

        // ========================================
        // 4. CARREGAR PLANTAS DA API
        // ========================================
        async function carregarPlantas() {
            try {
                const resposta = await fetch("/.netlify/functions/plantas");
                const resultado = await resposta.json();
                const grid = document.querySelector("#plants");

                grid.innerHTML = "";

                resultado.data.forEach(planta => {
                    const nome = planta.common_name?.toLowerCase().trim();
                    const nomePortugues = nomes[nome] || planta.common_name || "Planta";

                    grid.innerHTML += `
                        <article class="plant">
                            <img src="${planta.default_image?.regular_url || "https://placehold.co/600x400/e8f5e9/1b4332?text=CuidaPlanta"}"
                                 alt="${nomePortugues}"
                                 loading="lazy">
                            <div class="info">
                                <h2>${nomePortugues}</h2>
                            </div>
                        </article>`;
                });

            } catch (erro) {
                document.querySelector("#plants").innerHTML =
                    "<p>Não foi possível carregar as plantas.</p>";
            }
        }

        carregarPlantas();
    </script>
</body>
</html>

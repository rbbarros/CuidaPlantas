<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Guia de Plantinhas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #e8f5e9; margin: 0; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background: white; border-radius: 12px; width: 280px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .content { padding: 15px; }
        .card h3 { margin: 0 0 10px 0; color: #1b4332; }
        .info { background: #f1f8e9; padding: 10px; border-radius: 6px; font-size: 0.85rem; color: #2d6a4f; max-height: 75px; overflow: hidden; transition: max-height 0.3s ease; }
        .card.ativo .info { max-height: 1000px; }
        .info p { margin: 5px 0 0 0; }
    </style>
</head>
<body>
    <h1>🌿 Meu Guia de Plantinhas</h1>
    <p>Clique no card para ler o texto completo!</p>
    <div class="grid" id="plantas">Carregando...</div>

    <script>
        const plantas = [
            { id: "Epipremnum_aureum", nome: "Epipremnum aureum" },
            { id: "Samambaia", nome: "Samambaia" },
            { id: "Dracaena_trifasciata", nome: "Dracaena trifasciata" },
            { id: "Monstera_deliciosa", nome: "Monstera deliciosa" },
            { id: "Zamioculcas", nome: "Zamioculcas" },
            { id: "Spathiphyllum_wallisii", nome: "Spathiphyllum" }
        ];

        async function carregar() {
            const grid = document.getElementById("plantas");
            grid.innerHTML = "";
            for (const p of plantas) {
                try {
                    const res = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${p.id}`);
                    const d = await res.json();
                    grid.innerHTML += `
                        <div class="card" onclick="this.classList.toggle('ativo')">
                            <img src="${d.thumbnail ? d.thumbnail.source : ''}" alt="${p.nome}">
                            <div class="content">
                                <h3>${p.nome}</h3>
                                <div class="info"><strong>📖 Info API:</strong><p>${d.extract || ''}</p></div>
                            </div>
                        </div>`;
                } catch (e) { console.error(e); }
            }
        }
        carregar();
    </script>
</body>
</html>

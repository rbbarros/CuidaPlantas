<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubra plantas ideais para sua casa e aprenda como cuidar delas!">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
    <link rel="dns-prefetch" href="https://commons.wikimedia.org">
    <link rel="dns-prefetch" href="https://upload.wikimedia.org">
    <title>CuidaPlantas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            text-align: center;
            color: #2e7d32;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #1b5e20;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 8px #aaa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .img-container {
            width: 200px;
            height: 150px;
            aspect-ratio: 4/3;
            background-color: #c8e6c9;
            border-radius: 10px;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1b5e20;
        }
    </style>
</head>

<body>

    <h1>Cuida Plantas 🌱</h1>
    <p>Descubra plantas ideais para sua casa e aprenda como cuidar delas!</p>

    <div class="grid" id="plants">
        <p>Carregando plantas...</p>
    </div>

    <script>
        const plantas = [
            { nome: "Jiboia", cientifico: "Epipremnum aureum", rega: "A cada 3 a 5 dias", busca: "Epipremnum aureum", cuidado: "Luz indireta, ótima para ambientes internos e fácil para iniciantes." },
            { nome: "Espada-de-São-Jorge", cientifico: "Dracaena trifasciata", rega: "A cada 10 a 15 dias", busca: "Sansevieria trifasciata", cuidado: "Muito resistente. Pode ficar em locais com pouca luz." },
            { nome: "Samambaia", cientifico: "Nephrolepis exaltata", rega: "2 a 3 vezes por semana", busca: "Nephrolepis exaltata", cuidado: "Gosta de umidade e luz indireta." },
            { nome: "Zamioculca", cientifico: "Zamioculcas zamiifolia", rega: "A cada 7 a 10 dias", busca: "Zamioculcas zamiifolia", cuidado: "Ideal para apartamentos e pessoas que esquecem de regar." },
            { nome: "Lírio-da-paz", cientifico: "Spathiphyllum", rega: "2 a 3 vezes por semana", busca: "Spathiphyllum plant", cuidado: "Prefere sombra e solo sempre levemente úmido." },
            { nome: "Costela-de-Adão", cientifico: "Monstera deliciosa", rega: "1 a 2 vezes por semana", busca: "Monstera deliciosa", cuidado: "Gosta de ambientes iluminados sem sol direto." },
            { nome: "Pilea", cientifico: "Pilea peperomioides", rega: "A cada 5 a 7 dias", busca: "Pilea peperomioides", cuidado: "Prefere locais claros e protegidos do sol forte." },
            { nome: "Peperômia", cientifico: "Peperomia obtusifolia", rega: "A cada 5 a 7 dias", busca: "Peperomia obtusifolia", cuidado: "Boa para interiores e vasos pequenos." },
            { nome: "Suculentas", cientifico: "Diversas espécies", rega: "A cada 10 a 15 dias", busca: "succulent plant", cuidado: "Precisam de bastante luz e pouca água." },
            { nome: "Cactos", cientifico: "Cactaceae", rega: "A cada 15 a 30 dias", busca: "cactus plant", cuidado: "Resistentes e ideais para locais ensolarados." }
        ];

        function mostrarCuidados(texto) {
            alert(texto);
        }

        async function buscarImagemPlanta(termoBusca) {
            // Verificar cache primeiro
            const cacheKey = "img_" + termoBusca;
            const cached = localStorage.getItem(cacheKey);
            if (cached) return cached;

            const API = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="
                + encodeURIComponent(termoBusca) + "&gsrnamespace=6&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=250&format=json&origin=*";

            try {
                const resposta = await fetch(API);
                if (!resposta.ok) throw new Error("Erro na rede");
                const dados = await resposta.json();

                if (dados.query) {
                    const page = Object.values(dados.query.pages)[0];
                    if (page.thumbnail) {
                        const url = page.thumbnail.source.replace(/^http:/, 'https:');
                        localStorage.setItem(cacheKey, url);
                        return url;
                    }
                }
            } catch (erro) {
                console.error("Erro no fetch:", erro);
            }
            return "";
        }

        async function carregarImagem(img) {
            const url = await buscarImagemPlanta(img.dataset.busca);
            if (url) {
                img.src = url;
                img.style.display = "block";
            }
        }

        function carregarPlantas() {
            const grid = document.querySelector("#plants");

            grid.innerHTML = plantas.map((planta, index) => `
                <div class="card">
                    <div class="img-container">
                        <img 
                            src="" 
                            alt="${planta.nome}" 
                            width="200" 
                            height="150" 
                            loading="${index < 2 ? 'eager' : 'lazy'}"
                            ${index === 0 ? 'fetchpriority="high"' : ''}
                            data-busca="${planta.busca}"
                            style="display:none;"
                        >
                    </div>
                    <h3>${planta.nome} 🌿</h3>
                    <p><b>Nome científico:</b><br>${planta.cientifico}</p>
                    <p>💧 ${planta.rega}</p>
                    <button onclick="mostrarCuidados('${planta.cuidado}')">Ver cuidados</button>
                </div>
            `).join('');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target.querySelector('img[data-busca]');
                        if (img && !img.dataset.loaded) {
                            img.dataset.loaded = 'true';
                            carregarImagem(img);
                        }
                        observer.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '200px' });

            grid.querySelectorAll('.card').forEach(card => observer.observe(card));
        }

        carregarPlantas();
    </script>
</body>

</html>
